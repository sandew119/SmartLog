publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1

  camera: ^0.11.2
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  firebase_core: ^3.15.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/