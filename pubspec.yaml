name: smartlog2
description: SmartLog Wood Management App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1

  camera: ^0.11.2
  arkit_plugin: ^1.4.0
  vector_math: ^2.1.4
  collection: ^1.18.0
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  firebase_core: ^3.15.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+2
  flutter_launcher_icons: ^0.14.3

# Regenerate every platform's launcher icon with:
#   dart run flutter_launcher_icons
# The source is the wordmark-free square produced by tool/build_app_icon.py.
flutter_launcher_icons:
  image_path: "assets/logos/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  # A maskable/adaptive icon is cropped to a circle on modern Android, so it
  # gets the padded variant -- the viewfinder corners survive the crop.
  # The background matches the plate baked into the artwork, so there is no
  # seam whichever mask shape the launcher applies.
  adaptive_icon_background: "#EBEBEB"
  adaptive_icon_foreground: "assets/logos/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/